[package]
name = "ntools-renderer"
version = "0.1.0"
edition = "2024"
default-run = "ntools-renderer"

[dependencies]
anyhow = "1.0.104"
bmfont_rs = "0.4.0"
# parsing command line arguments
clap = { version = "4.6.4", features = ["derive"] }
fontdue = "0.9.4"
gif = "0.14.2"
# game logic
ntools-rs = { path = "../ntools-rs" }
# graphics library
tiny-skia = "0.12.0"
weezl = { path = "../../weezl" }

[patch.crates-io]
weezl = { path = "../../weezl" }
